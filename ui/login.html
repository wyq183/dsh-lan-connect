<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>需要登录 · dsh</title>
<style>
  :root {
    --bg: #0d1117;
    --panel: #151b23;
    --panel-2: #1b222c;
    --border: #2a3242;
    --text: #e6edf3;
    --muted: #8b98a9;
    --accent: #4da3ff;
    --danger: #f85149;
    --ok: #3fb950;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: var(--bg); color: var(--text);
    font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 100%; max-width: 380px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px 26px;
    box-shadow: 0 18px 60px rgba(0,0,0,.4);
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 4px; }
  .brand .icon { font-size: 20px; }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12.5px; margin: 6px 0 22px; line-height: 1.7; }
  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; font-weight: 600; }
  input {
    width: 100%; font: inherit; font-size: 14px;
    color: var(--text); background: var(--panel-2);
    border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; margin-bottom: 16px;
    outline: none; transition: border-color .15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    width: 100%; font: inherit; font-size: 14px; font-weight: 600;
    color: #fff; background: var(--accent);
    border: none; border-radius: 9px; padding: 11px;
    cursor: pointer; transition: opacity .15s;
  }
  button:hover { opacity: .9; }
  button:disabled { opacity: .5; cursor: default; }
  .msg {
    display: none; font-size: 12.5px; border-radius: 8px;
    padding: 9px 12px; margin-bottom: 16px; line-height: 1.6;
  }
  .msg.err { display: block; background: rgba(248,81,73,.12); color: #ffb4ae; border: 1px solid rgba(248,81,73,.3); }
  .msg.ok { display: block; background: rgba(63,185,80,.12); color: #8ee79a; border: 1px solid rgba(63,185,80,.3); }
  .hint { color: var(--muted); font-size: 11.5px; margin-top: 18px; line-height: 1.7; }
  .foot { color: var(--muted); font-size: 11px; margin-top: 14px; text-align: center; opacity: .7; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="icon">🔒</span><h1 id="title">需要登录</h1></div>
  <div class="sub" id="subtitle">正在检查…</div>

  <div class="msg" id="msg"></div>

  <form id="form" autocomplete="on">
    <label for="user">账号</label>
    <input id="user" name="user" type="text" autocomplete="username" autocapitalize="off" spellcheck="false" required>

    <label for="pass">密码</label>
    <input id="pass" name="pass" type="password" autocomplete="current-password" required>

    <label for="pass2" id="pass2Label" class="hidden">确认密码</label>
    <input id="pass2" name="pass2" type="password" autocomplete="new-password" class="hidden">

    <button type="submit" id="submit">登录</button>
  </form>

  <div class="hint" id="hint"></div>
  <div class="foot">dsh-lan-connect · 通过验证后可保持一周</div>
</div>

<script>
(function () {
  'use strict';
  var GATE = '/__gate';

  function $(id) { return document.getElementById(id); }

  var mode = 'login'; // 'login' | 'setup'
  var busy = false;

  function showMsg(text, kind) {
    var el = $('msg');
    el.textContent = text;
    el.className = 'msg ' + (kind === 'ok' ? 'ok' : 'err');
  }
  function clearMsg() {
    var el = $('msg');
    el.className = 'msg';
    el.textContent = '';
  }

  function applyMode(next) {
    mode = next;
    var setup = next === 'setup';
    $('title').textContent = setup ? '设置访问密码' : '需要登录';
    $('submit').textContent = setup ? '设置并进入' : '登录';
    $('pass2').className = setup ? '' : 'hidden';
    $('pass2Label').className = setup ? '' : 'hidden';
    $('pass2').required = setup;
    $('pass').setAttribute('autocomplete', setup ? 'new-password' : 'current-password');
    $('hint').textContent = setup
      ? '这是第一次使用，请设置一个账号和密码。之后每台设备需要登录，验证状态保持一周。'
      : '验证状态保持一周，到期后需要重新输入。';
  }

  function loadState() {
    return fetch(GATE + '/state', { headers: { accept: 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (s) {
        if (s.needsSetup) {
          applyMode('setup');
          $('subtitle').textContent = '还没有设置访问密码';
        } else if (s.localOnlySetup) {
          // 局域网设备 + 尚未设置账号：不允许在这里设置
          $('subtitle').textContent = '这台 dsh 还没有设置访问密码';
          showMsg('请先在这台电脑上打开 http://127.0.0.1:' + s.localPort + '/ 完成设置。', 'err');
          $('submit').disabled = true;
          $('user').disabled = true;
          $('pass').disabled = true;
        } else {
          applyMode('login');
          $('subtitle').textContent = '这台 dsh 已启用访问验证';
        }
      })
      .catch(function () {
        $('subtitle').textContent = '无法读取状态';
        showMsg('连接失败，请刷新重试。', 'err');
      });
  }

  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) return;

    var user = $('user').value.trim();
    var pass = $('pass').value;
    if (user === '' || pass === '') { showMsg('账号和密码都要填。', 'err'); return; }

    if (mode === 'setup') {
      if (pass.length < 6) { showMsg('密码至少 6 位。', 'err'); return; }
      if (pass !== $('pass2').value) { showMsg('两次输入的密码不一致。', 'err'); return; }
    }

    busy = true;
    $('submit').disabled = true;
    clearMsg();

    var body = new URLSearchParams();
    body.set('user', user);
    body.set('password', pass);

    fetch(GATE + '/login', {
      method: 'POST',
      headers: { 'content-type': 'application/x-www-form-urlencoded' },
      body: body.toString()
    })
      .then(function (r) { return r.json().then(function (b) { return { ok: r.ok, body: b }; }); })
      .then(function (res) {
        if (!res.ok || !res.body.ok) {
          showMsg(res.body.error || '登录失败', 'err');
          busy = false;
          $('submit').disabled = false;
          return;
        }
        showMsg('验证通过，正在进入…', 'ok');
        // 服务端已经种下 cookie，整页跳转让浏览器带上它
        window.location.replace('/');
      })
      .catch(function () {
        showMsg('连接失败，请重试。', 'err');
        busy = false;
        $('submit').disabled = false;
      });
  });

  loadState();
})();
</script>
</body>
</html>
